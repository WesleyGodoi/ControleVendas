name: Deploy PWA (GitHub Pages)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    name: 🚀 Testar e Compilar PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Executar Testes Automatizados
        run: dotnet test ControleVendasLajes.Tests/ControleVendasLajes.Tests.csproj -c Release

      - name: Publicar Blazor WebAssembly PWA
        run: dotnet publish ControleVendasLajes.PWA/ControleVendasLajes.PWA.csproj -c Release -o publish

      - name: Configurar Roteamento SPA e .nojekyll
        run: |
          touch publish/wwwroot/.nojekyll
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Enviar Artefatos para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    name: 🌐 Publicar no GitHub Pages
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Realizar Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
